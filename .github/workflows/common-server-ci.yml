name: App Insights E2E Debug

on:
  workflow_dispatch:
    inputs:
      instrumentation_key:
        description: Application Insights instrumentation key
        required: true
        type: string
      workspace_id:
        description: Log Analytics Workspace ID (GUID)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  App-Insights-E2E:
    runs-on: ubuntu-latest
    environment: Server-CI
    env:
      AML_APP_INSIGHTS_KEY: ${{ inputs.instrumentation_key }}
      AML_LOG_ANALYTICS_WORKSPACE_ID: ${{ inputs.workspace_id }}
    steps:
      - name: Mask telemetry identifiers
        shell: bash
        run: |
          echo "::add-mask::$AML_APP_INSIGHTS_KEY"
          echo "::add-mask::$AML_LOG_ANALYTICS_WORKSPACE_ID"

      - name: Clone branch
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Set Python version
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'

      - name: Log in to Azure
        uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1.6.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install test dependencies
        run: pip install -e '.[dev]'

      - name: Run App Insights E2E test
        timeout-minutes: 10
        run: python -m pytest tests/server/test_app_insights.py::test_appinsights_e2e --online -v
